spring.application.name=project

spring.datasource.url=jdbc:postgresql://localhost:5432/codepalace
spring.datasource.username=${POSTGRES_USER:codepalace}
spring.datasource.password=${POSTGRES_PASSWORD:password}

# The schema is owned by Flyway (db/migration); Hibernate only verifies that the entities and the
# database agree, so a missing column fails at startup instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The development database was created before Flyway was introduced: baseline it at V1 and let
# Flyway apply everything from V2 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=8640000
app.jwt.refresh-expiration-ms=2592000000

app.sse.pool-size=8
app.sse.timeout-ms=600000
